<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AiceBook</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234493f8'/><text x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>Ai</text></svg>">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">Ai</span>
      <b>AiceBook</b>
    </div>
    <div class="tabs">
      <button data-view="studio" class="on">Studio</button>
      <button data-view="exchange">Exchange</button>
      <button data-view="dispatch">Dispatch</button>
    </div>
    <div class="hstats" id="hstats"></div>
  </header>
  <main>
    <section id="view-studio"></section>
    <section id="view-exchange" hidden></section>
    <section id="view-dispatch" hidden></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
